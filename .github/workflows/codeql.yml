name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly, because advisories land between pushes: a rule added after the
    # last commit would otherwise never run against this code.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    # Uploading results needs code scanning, which on a private repository
    # requires GitHub Advanced Security. Without it the analyze step fails on
    # every push, so the job is skipped rather than left permanently red — and
    # it starts running by itself the moment the repository becomes public.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.7
        with:
          languages: python
          # security-and-quality over the default: the framework executes
          # user-declared code and serves HTTP, so the extra checks earn their
          # noise here.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:python"
